name: Validate browser sixel fix

on:
  push:
    branches: [chore/validate-web-sixel]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: sixel-browser
      - name: Allow test user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Go unit tests
        run: |
          set -o pipefail
          pkgs="./... ./progstatus/... ./vt/... ./swatch/... ./shot/... ./tml/... ./plot/... ./loom/... ./sketch/..."
          go test $pkgs -count=1 -timeout 20m 2>&1 | tee "$RUNNER_TEMP/unit.log" ||
            scripts/retry-flaky.sh "$RUNNER_TEMP/unit.log" $pkgs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sixel-unit
          path: ${{ runner.temp }}/unit.log
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: sixel-browser
      - name: Prepared Learn WASM compile
        run: |
          modfile=$(bash cmd/tuios-wasm/prepare.sh)
          GOWORK=off GOOS=js GOARCH=wasm go build -modfile "$modfile" -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/tuios.wasm" ./cmd/tuios-wasm
          sha256sum "$RUNNER_TEMP/tuios.wasm" > "$RUNNER_TEMP/wasm-build.txt"
          stat -c '%s bytes' "$RUNNER_TEMP/tuios.wasm" >> "$RUNNER_TEMP/wasm-build.txt"
          cat "$RUNNER_TEMP/wasm-build.txt"
      - name: Release binary sizes on the branch
        env:
          SIZE_OUT: ${{ runner.temp }}/size-head.txt
        run: bash scripts/binary-size.sh
      - name: Release binary sizes on the PR base
        env:
          SIZE_OUT: ${{ runner.temp }}/size-base.txt
        run: |
          git worktree add --detach "$RUNNER_TEMP/sixel-baseline" c725ff16a1ced07303c3a3da74bc7e4ff62d1b0a
          bash "$RUNNER_TEMP/sixel-baseline/scripts/binary-size.sh"
      - name: Compare bytes
        run: |
          python3 -c 'import json, os, pathlib; root=pathlib.Path(os.environ["RUNNER_TEMP"]); read=lambda name:{k:int(v) for k,v in (row.split() for row in (root/name).read_text().splitlines())}; head=read("size-head.txt"); base=read("size-base.txt"); assert set(head)==set(base)=={"linux/amd64","darwin/arm64"}; result={"source":"09402161e1f450fe325a467bd47e86065b9a0a62","base":"c725ff16a1ced07303c3a3da74bc7e4ff62d1b0a","head":head,"baseline":base,"delta":{k:head[k]-base[k] for k in head}}; text=json.dumps(result,indent=2); (root/"binary-size-delta.json").write_text(text+"\n"); print(text)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sixel-compatibility
          path: |
            ${{ runner.temp }}/wasm-build.txt
            ${{ runner.temp }}/size-head.txt
            ${{ runner.temp }}/size-base.txt
            ${{ runner.temp }}/binary-size-delta.json
